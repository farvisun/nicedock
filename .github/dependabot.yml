# Weekly dependency updates; minor and patch bumps come grouped in one pull request.
version: 2
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      swift-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-and-patch:
        update-types: [minor, patch]
